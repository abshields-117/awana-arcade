  <script>(function(){try{const forced=new URLSearchParams(location.search).has('terminal');if(!forced&&sessionStorage.getItem('covenant-terminal-unlocked')==='1')location.replace('arcade.html')}catch(_){}})();</script>
  <style>
    :root{--green:#54ff78;--dim:#15913c;--black:#010403;--line:#123d20;--amber:#ffd166;--red:#ff6b6b;--size:clamp(17px,1.65vw,23px)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--black);color:var(--green);font-family:"Courier New",ui-monospace,monospace;font-size:var(--size)}body{min-height:100vh;min-height:100dvh;padding:clamp(8px,2vw,24px);overflow-x:hidden;background-image:radial-gradient(ellipse at center,rgba(22,83,43,.16),transparent 68%)}body.large{--size:clamp(21px,2vw,29px)}body.paused *{animation-play-state:paused!important}.crt{position:fixed;inset:0;pointer-events:none;z-index:20;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 4px);opacity:.34}.shell{width:min(1180px,100%);min-height:calc(100vh - 48px);margin:auto;border:1px solid var(--dim);box-shadow:0 0 34px rgba(53,255,103,.12),inset 0 0 45px rgba(0,0,0,.7);display:grid;grid-template-rows:auto 1fr auto;background:rgba(1,8,4,.96)}header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.68rem;letter-spacing:.07em}.brand{font-weight:700}.state{color:#94ffac}.controls{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}button,.button{font:inherit;color:var(--green);background:#041208;border:1px solid var(--dim);padding:7px 10px;min-height:40px;cursor:pointer;text-decoration:none}button:hover,button:focus-visible,.button:focus-visible{outline:2px solid var(--green);outline-offset:2px;background:#0b2a14}#screen{overflow-y:auto;min-height:54vh;max-height:calc(100vh - 154px);padding:clamp(14px,3vw,34px);scrollbar-color:var(--dim) var(--black);white-space:pre-wrap;line-height:1.42;text-shadow:0 0 8px rgba(84,255,120,.3)}.line{margin:0 0 .62em}.boot{color:#83d994}.prompt-line{color:#c2ffcf}.error{color:var(--red)}.warn{color:var(--amber)}.success{color:#e2ffe9;font-weight:700}.mission{border-left:3px solid var(--green);padding-left:14px;margin:1em 0;color:#b8ffc7}.muted{color:#72aa7e}form#terminal-form{display:flex;align-items:center;border-top:1px solid var(--line);padding:10px 14px;background:#020b05}.ps1{flex:none;margin-right:10px;font-weight:700}input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:#e8ffed;font:inherit;caret-color:var(--green);padding:8px 0}.cursor{width:.65em;height:1.05em;background:var(--green);animation:blink 1s steps(1) infinite;flex:none;margin-left:4px;box-shadow:0 0 8px var(--green)}@keyframes blink{50%{opacity:0}}.hotspot{position:fixed;right:3px;bottom:3px;z-index:30;width:28px;height:28px;min-height:28px;padding:0;border:0;background:transparent;color:#0a3517;font-size:12px}.hotspot:focus-visible{color:var(--green)}dialog{width:min(640px,calc(100% - 28px));color:var(--green);background:#020805;border:1px solid var(--green);padding:0;box-shadow:0 0 60px #000;font:inherit}dialog::backdrop{background:rgba(0,0,0,.82)}.modal-head,.modal-body{padding:16px}.modal-head{display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}.modal-body label{display:block;margin-bottom:8px}.modal-body input{border:1px solid var(--dim);padding:10px;margin-bottom:10px}.leader-tools{display:none;gap:8px;flex-wrap:wrap;margin-top:14px}.leader-tools.open{display:flex}.leader-readout{margin:12px 0;padding:10px;border:1px dashed var(--dim);white-space:pre-wrap}.complete{border:1px solid var(--green);padding:18px;margin-top:18px}.complete .button{display:inline-block;margin-top:12px}@media(max-width:650px){body{padding:0}.shell{min-height:100dvh;border-left:0;border-right:0}header{align-items:flex-start;flex-direction:column}.controls{justify-content:flex-start}#screen{max-height:none;min-height:calc(100dvh - 190px);padding:16px}.controls button{font-size:.72rem;padding:6px 8px}.crt{opacity:.2}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}.cursor{opacity:1}}
  </style>
</head>
<body><div class="crt" aria-hidden="true"></div>
<main class="shell" aria-label="Covenant Terminal mission engine"><header><div><span class="brand">COVENANT//TERMINAL</span> <span class="state">LINK: LOCAL</span></div><div class="controls" aria-label="Display controls"><button type="button" id="large-toggle">LARGE TEXT</button><button type="button" id="pause-toggle">PAUSE CRT</button><button type="button" id="sound-toggle" aria-pressed="false">SOUND: OFF</button><button type="button" id="fullscreen-toggle">FULLSCREEN</button></div></header><section id="screen" role="log" aria-live="polite" aria-label="Terminal output"></section><form id="terminal-form" autocomplete="off"><label class="ps1" for="command-input">ark@archive:$</label><input id="command-input" name="command" type="text" enterkeyhint="send" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Terminal command" autofocus><span class="cursor" aria-hidden="true"></span></form></main>
<button class="hotspot" id="leader-hotspot" type="button" aria-label="Leader access">⌁</button>
<dialog id="leader-dialog" role="dialog" aria-labelledby="leader-title"><div class="modal-head"><strong id="leader-title">LEADER CHANNEL</strong><button type="button" id="leader-close" aria-label="Close leader panel">X</button></div><div class="modal-body"><form id="leader-form"><label for="leader-code">Access code</label><input id="leader-code" type="password" autocomplete="off"><button type="submit">AUTHORIZE</button></form><p id="leader-message" role="status"></p><div id="leader-tools" class="leader-tools"><button type="button" data-leader="answer">CURRENT ANSWER</button><button type="button" data-leader="hint">SHOW HINT</button><button type="button" data-leader="skip">SKIP STEP</button><button type="button" data-leader="reset">RESET MISSION</button><button type="button" data-leader="arcade">OPEN ARCADE</button><button type="button" data-leader="relock">RELOCK</button></div><div class="leader-readout" id="leader-readout" aria-live="polite">Channel locked.</div></div></dialog>
<script src="js/terminal-missions.js"></script>
<script>
(function(){'use strict';const API=window.CovenantTerminalMissions,mission=API.createMission(),screen=document.getElementById('screen'),input=document.getElementById('command-input'),form=document.getElementById('terminal-form');let memory={},history=[],historyAt=0,hotspotClicks=0,sound=false,audio=null;
function storeGet(key){try{return sessionStorage.getItem(key)}catch(_){return memory[key]??null}}function storeSet(key,value){try{sessionStorage.setItem(key,value)}catch(_){memory[key]=value}}function storeRemove(key){try{sessionStorage.removeItem(key)}catch(_){delete memory[key]}}function defaultState(){return{index:0,hints:{},completed:false}}function loadState(){try{const parsed=JSON.parse(storeGet(API.STORAGE_KEY)||'null');return parsed&&Number.isInteger(parsed.index)?parsed:defaultState()}catch(_){return defaultState()}}let state=loadState();function save(){storeSet(API.STORAGE_KEY,JSON.stringify(state))}function add(text,kind='line'){const p=document.createElement('div');p.className='line '+kind;p.textContent=String(text);screen.appendChild(p);screen.scrollTop=screen.scrollHeight}function tone(ok=true){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=ok?660:180;g.gain.value=.025;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.09);o.stop(audio.currentTime+.1)}catch(_){}}function puzzle(){return mission.puzzles[Math.min(state.index,mission.puzzles.length-1)]}
function showMission(){if(state.completed){showComplete();return}add(`[MISSION ${state.index+1}/${mission.puzzles.length}]\n${puzzle().prompt}`,'mission')}function showComplete(){if(document.getElementById('completion'))return;const box=document.createElement('div');box.id='completion';box.className='complete success';box.textContent='ARCHIVE RESTORED // TEAM SUCCEEDED\nReport to your leader for the earned treat. ';const a=document.createElement('button');a.type='button';a.className='button';a.textContent='UNLOCK NORMAL ARCADE';a.addEventListener('click',openArcade);box.appendChild(document.createElement('br'));box.appendChild(a);screen.appendChild(box);screen.scrollTop=screen.scrollHeight}function boot(){screen.textContent='';add('COVENANT ARCHIVE NODE 06 // LOCAL OFFLINE LINK','boot');add('Human logging system: CORRUPTED\nAuthenticated Scripture records: READ-ONLY\nGod’s commands remain correct. Fictional systems are labeled.','boot');add('Hint: type HELP','prompt-line')}function openArcade(){storeSet(API.UNLOCK_KEY,'1');location.href='arcade.html'}function completeStep(result){add(result.message,'success');tone(true);state.index++;if(state.index>=mission.puzzles.length){state.completed=true;state.index=mission.puzzles.length;save();showComplete()}else{save();showMission()}}
function handle(raw){const parsed=API.parseCommand(raw);if(parsed.error)return;add(`ark@archive:$ ${raw}`,'prompt-line');if(!API.COMMANDS.includes(parsed.command)){add(`Unknown command: ${parsed.command}. Type HELP.`,'error');tone(false);return}const p=puzzle();if(parsed.command==='HELP'){add('COMMANDS\nHELP STATUS MISSION FILES READ <path> SCAN ANSWER <text> HINT CLEAR MAP\nContext commands appear when needed: REPAIR, TRACK, RUN.\nCommands ignore case and outer spaces. Paths, flags, and internal syntax still matter.');return}if(parsed.command==='STATUS'){add(state.completed?'STATUS: ARCHIVE RESTORED':`STATUS: STEP ${state.index+1}/${mission.puzzles.length} // ERRORS DO NOT ERASE PROGRESS`);return}if(parsed.command==='MISSION'){showMission();return}if(parsed.command==='MAP'){add('MAP: /archive  /records  /logs  /sim  /tools  /bin');return}if(parsed.command==='CLEAR'){screen.textContent='';add('Display cleared. Progress preserved.','muted');return}if(parsed.command==='FILES'){add(p.files.join('\n'));return}if(parsed.command==='SCAN'){add(p.scan);return}if(parsed.command==='HINT'){const level=API.nextHint(state,p.id);save();add(`HINT ${level+1}/3: ${p.hints[level]}`,'warn');return}if(parsed.command==='READ'){if(!parsed.rawArgs){add(p.syntax,'warn');return}const key=Object.keys(p.read||{}).find(k=>k.toLowerCase()===parsed.rawArgs.toLowerCase());if(key)add(p.read[key]);else{add(`FILE NOT FOUND: ${parsed.rawArgs}`,'error');return}}const result=API.evaluateAction(p,parsed);if(result.ok)completeStep(result);else{add(result.message,result.kind==='SYNTAX'?'warn':'error');tone(false)}}
form.addEventListener('submit',e=>{e.preventDefault();const raw=input.value;if(raw.trim()){history.push(raw);historyAt=history.length;handle(raw)}input.value='';input.focus()});input.addEventListener('keydown',e=>{if(e.key==='ArrowUp'&&history.length){e.preventDefault();historyAt=Math.max(0,historyAt-1);input.value=history[historyAt]||''}if(e.key==='ArrowDown'){e.preventDefault();historyAt=Math.min(history.length,historyAt+1);input.value=history[historyAt]||''}});document.getElementById('large-toggle').onclick=()=>document.body.classList.toggle('large');document.getElementById('pause-toggle').onclick=()=>{const on=document.body.classList.toggle('paused');document.getElementById('pause-toggle').textContent=on?'RESUME CRT':'PAUSE CRT'};document.getElementById('sound-toggle').onclick=()=>{sound=!sound;const b=document.getElementById('sound-toggle');b.textContent=`SOUND: ${sound?'ON':'OFF'}`;b.setAttribute('aria-pressed',String(sound));tone(true)};document.getElementById('fullscreen-toggle').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(_){add('Fullscreen unavailable in this browser.','warn')}};
const dialog=document.getElementById('leader-dialog'),leaderMessage=document.getElementById('leader-message'),tools=document.getElementById('leader-tools'),readout=document.getElementById('leader-readout');function openLeader(){hotspotClicks=0;dialog.showModal();document.getElementById('leader-code').focus()}document.getElementById('leader-hotspot').onclick=()=>{hotspotClicks++;if(hotspotClicks>=5)openLeader()};document.getElementById('leader-close').onclick=()=>dialog.close();document.getElementById('leader-form').onsubmit=e=>{e.preventDefault();const code=document.getElementById('leader-code').value.trim().toUpperCase();document.getElementById('leader-code').value='';if(code==='AWANA'){leaderMessage.textContent='Channel authorized.';tools.classList.add('open');readout.textContent=`STEP ${Math.min(state.index+1,mission.puzzles.length)}/${mission.puzzles.length}`}else{leaderMessage.textContent='Access denied.';tools.classList.remove('open');readout.textContent='Channel locked.'}};tools.onclick=e=>{const action=e.target.dataset.leader;if(!action)return;const p=puzzle();if(action==='answer')readout.textContent=`${p.accepts[0].command} ${p.accepts[0].value}`;if(action==='hint'){const n=API.nextHint(state,p.id);save();readout.textContent=`HINT ${n+1}/3: ${p.hints[n]}`}if(action==='skip'){if(!state.completed)completeStep({message:'Leader advanced this step.'});readout.textContent='Step advanced.'}if(action==='reset'){state=defaultState();save();dialog.close();boot()}if(action==='arcade')openArcade();if(action==='relock'){storeRemove(API.UNLOCK_KEY);storeRemove(API.STORAGE_KEY);state=defaultState();location.href='index.html?relocked=1'}};document.addEventListener('click',e=>{if(!e.target.closest('button,input,dialog'))input.focus()});boot();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));})();
</script></body></html>

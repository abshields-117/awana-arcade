<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020704">
  <link rel="manifest" href="manifest.json">
  <title>COVENANT//TERMINAL — The Corrupted Flood Archive</title>
  <script>(function(){try{const forced=new URLSearchParams(location.search).has('terminal');if(!forced&&sessionStorage.getItem('covenant-terminal-unlocked')==='1')location.replace('arcade.html')}catch(_){}})();</script>
  <style>
    :root{--green:#54ff78;--dim:#15913c;--black:#010403;--line:#123d20;--amber:#ffd166;--red:#ff7979;--size:clamp(17px,1.65vw,23px)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--black);color:var(--green);font-family:"Courier New",ui-monospace,monospace;font-size:var(--size)}
    body{min-height:100vh;min-height:100dvh;padding:clamp(8px,2vw,24px);overflow-x:hidden;background-image:radial-gradient(ellipse at center,rgba(22,83,43,.16),transparent 68%)}body.large{--size:clamp(21px,2vw,29px)}body.paused *{animation-play-state:paused!important}
    .crt{position:fixed;inset:0;pointer-events:none;z-index:20;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 4px);opacity:.34}
    .shell{width:min(1180px,100%);min-height:calc(100vh - 48px);margin:auto;border:1px solid var(--dim);box-shadow:0 0 34px rgba(53,255,103,.12),inset 0 0 45px rgba(0,0,0,.7);display:grid;grid-template-rows:auto 1fr auto;background:rgba(1,8,4,.96)}
    header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.68rem;letter-spacing:.07em}.brand{font-weight:700}.state{color:#ffad91}.state .link-dot{width:.48em;height:.48em;margin:0 .42em 0 .55em}.controls{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
    button,.button{font:inherit;color:var(--green);background:#041208;border:1px solid var(--dim);padding:7px 10px;min-height:40px;cursor:pointer;text-decoration:none}button:hover,button:focus-visible,.button:focus-visible{outline:2px solid var(--green);outline-offset:2px;background:#0b2a14}[hidden]{display:none!important}
    #screen{overflow-y:auto;min-height:54vh;max-height:calc(100vh - 154px);padding:clamp(14px,3vw,34px);scrollbar-color:var(--dim) var(--black);white-space:pre-wrap;line-height:1.42;text-shadow:0 0 8px rgba(84,255,120,.3)}.line{margin:0 0 .65em}.prompt-line{color:#c2ffcf}.error{color:var(--red)}.warn{color:var(--amber)}.success{color:#e2ffe9;font-weight:700}.mission{border-left:3px solid var(--green);padding-left:14px;margin:.25em 0;color:#b8ffc7}.guide{display:block;margin-top:1em;color:#fff59d;font-weight:700}.muted{color:#72aa7e}.loading{letter-spacing:.04em}.progress{height:14px;width:min(520px,100%);border:1px solid var(--dim);margin:.7em 0}.progress>i{display:block;height:100%;background:var(--green);box-shadow:0 0 10px var(--green);transition:width .3s ease}
    .boot-diagnostic{width:min(690px,100%);margin:0 0 .72em;font-size:.82em;line-height:1.24;letter-spacing:.025em}.boot-row{margin:0 0 .22em;animation:boot-reveal .24s ease-out both;animation-delay:calc(var(--row,0)*.11s)}.boot-label{color:#c8ffd3;font-weight:700;margin-bottom:.55em}.disconnect-dot{display:inline-block;width:.62em;height:.62em;margin-right:.55em;border-radius:50%;background:var(--red);box-shadow:0 0 7px var(--red);animation:signal-pulse 2.4s ease-in-out infinite}.boot-status{display:block;white-space:nowrap}.boot-status>span:first-child{display:inline-block;min-width:15.5em}.boot-status .dots{display:inline;color:#317441}.boot-status .value{font-weight:700}.boot-status .down{color:#ff9b73}.boot-status .locked{color:#8dffac}.boot-status .corrupt{color:var(--amber)}.boot-taunt{color:#b7ffc6;font-weight:700;margin-top:.48em}.boot-objective{color:#e6ffeb;margin-top:.45em}.signal-glitch{display:inline-block;animation:signal-distort 8s linear infinite}@keyframes boot-reveal{from{opacity:.42;transform:translateY(2px)}to{opacity:1;transform:none}}@keyframes signal-pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes signal-distort{0%,96%,98%,100%{transform:none;text-shadow:inherit}97%{transform:translateX(1px) skewX(-8deg);text-shadow:1px 0 var(--red)}}
    form#terminal-form{display:flex;align-items:center;min-height:58px;border-top:1px solid var(--line);padding:8px 14px;background:#020b05}form#terminal-form:focus-within{box-shadow:inset 0 0 0 2px rgba(84,255,120,.28)}.ps1{flex:none;margin-right:.55em;font-weight:700;font-size:1.15em}#command-input{flex:1;width:1px;min-width:0;border:0;outline:0;background:transparent;color:#e8ffed;font:inherit;font-size:1.08em;caret-color:var(--green);padding:10px 0;min-height:44px}#command-input:disabled{opacity:.4}
    .hotspot{position:fixed;right:3px;bottom:3px;z-index:30;width:28px;height:28px;min-height:28px;padding:0;border:0;background:transparent;color:#0a3517;font-size:12px}.hotspot:focus-visible{color:var(--green)}
    dialog{width:min(640px,calc(100% - 28px));color:var(--green);background:#020805;border:1px solid var(--green);padding:0;box-shadow:0 0 60px #000;font:inherit}dialog::backdrop{background:rgba(0,0,0,.82)}.modal-head,.modal-body{padding:16px}.modal-head{display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}.modal-body label{display:block;margin-bottom:8px}.modal-body input{width:100%;border:1px solid var(--dim);background:#010403;color:#e8ffed;font:inherit;padding:10px;margin-bottom:10px}.leader-tools{display:none;gap:8px;flex-wrap:wrap;margin-top:14px}.leader-tools.open{display:flex}.leader-readout{margin:12px 0;padding:10px;border:1px dashed var(--dim);white-space:pre-wrap}.complete{border:1px solid var(--green);padding:18px;margin-top:18px}.complete .button{display:inline-block;margin-top:12px}
    @media(max-width:650px){body{padding:0}.shell{min-height:100dvh;border-left:0;border-right:0}header{align-items:flex-start;flex-direction:column}.controls{justify-content:flex-start}.controls button{font-size:.67rem;padding:5px 7px;min-height:36px}#screen{max-height:none;min-height:calc(100dvh - 190px);padding:16px}.boot-diagnostic{font-size:.75em;letter-spacing:0}.boot-status>span:first-child{min-width:15.5em}form#terminal-form{position:sticky;bottom:0;padding-bottom:max(8px,env(safe-area-inset-bottom));background:#020b05}.crt{opacity:.2}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}.boot-row{animation:none!important;opacity:1!important;transform:none!important}}
  </style>
</head>
<body><div class="crt" aria-hidden="true"></div>
<main class="shell" aria-label="Covenant Terminal mission engine">
  <header><div><span class="brand">COVENANT//TERMINAL</span> <span class="state" id="link-state"><span class="disconnect-dot link-dot" aria-hidden="true"></span>LINK: DISCONNECTED</span></div><div class="controls" aria-label="Display controls"><button type="button" id="skip-loading" hidden>SKIP LOADING</button><button type="button" id="large-toggle">LARGE TEXT</button><button type="button" id="pause-toggle">PAUSE CRT</button><button type="button" id="sound-toggle" aria-pressed="false">SOUND: OFF</button><button type="button" id="fullscreen-toggle">FULLSCREEN</button></div></header>
  <section id="screen" role="log" aria-live="polite" aria-label="Terminal output"></section>
  <form id="terminal-form" autocomplete="off"><label class="ps1" for="command-input">&gt;</label><input id="command-input" name="command" type="text" enterkeyhint="send" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Type a terminal command" aria-describedby="input-help" autofocus><span id="input-help" hidden>Type a command and press Enter.</span></form>
</main>
<button class="hotspot" id="leader-hotspot" type="button" aria-label="Leader access">⌁</button>
<dialog id="leader-dialog" role="dialog" aria-labelledby="leader-title"><div class="modal-head"><strong id="leader-title">LEADER CHANNEL</strong><button type="button" id="leader-close" aria-label="Close leader panel">X</button></div><div class="modal-body"><form id="leader-form"><label for="leader-code">Access code</label><input id="leader-code" type="password" autocomplete="off"><button type="submit">AUTHORIZE</button></form><p id="leader-message" role="status"></p><div id="leader-tools" class="leader-tools"><button type="button" data-leader="answer">CURRENT ANSWER</button><button type="button" data-leader="hint">SHOW HINT</button><button type="button" data-leader="skip">SKIP STEP</button><button type="button" data-leader="reset">RESET MISSION</button><button type="button" data-leader="arcade">OPEN ARCADE</button><button type="button" data-leader="support">MoR SUPPORT DISPLAY</button><button type="button" data-leader="relock">RELOCK</button></div><div class="leader-readout" id="leader-readout" aria-live="polite">Channel locked.</div></div></dialog>
<script src="js/terminal-missions.js"></script>
<script>
(function(){'use strict';
const API=window.CovenantTerminalMissions,mission=API.createMission(),screen=document.getElementById('screen'),input=document.getElementById('command-input'),form=document.getElementById('terminal-form'),skipLoading=document.getElementById('skip-loading');
let memory={},history=[],historyAt=0,transcript=[],hotspotClicks=0,sound=false,audio=null,loadingTimers=[];
function storeGet(key){try{return sessionStorage.getItem(key)}catch(_){return memory[key]??null}}
function storeSet(key,value){try{sessionStorage.setItem(key,value)}catch(_){memory[key]=value}}
function storeRemove(key){try{sessionStorage.removeItem(key)}catch(_){delete memory[key]}}
function defaultState(){return{index:0,hints:{},completed:false,started:false}}
function loadState(){try{const parsed=JSON.parse(storeGet(API.STORAGE_KEY)||'null');return parsed&&Number.isInteger(parsed.index)?Object.assign(defaultState(),parsed):defaultState()}catch(_){return defaultState()}}
let state=loadState();
function save(){storeSet(API.STORAGE_KEY,JSON.stringify(state))}
function add(text,kind='line',record=true){const value=String(text),p=document.createElement('div');p.className='line '+kind;p.textContent=value;screen.appendChild(p);if(record)transcript.push(value);screen.scrollTop=screen.scrollHeight;return p}
function clearScreen(){screen.textContent=''}
function tone(ok=true){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=ok?660:180;g.gain.value=.025;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.09);o.stop(audio.currentTime+.1)}catch(_){}}
function puzzle(){return mission.puzzles[Math.min(state.index,mission.puzzles.length-1)]}
function showMission(){clearScreen();if(state.completed){showComplete();return}const p=puzzle();const reveal=state.index===1?`\n\n${mission.reveal}`:'';add(`[MISSION ${state.index+1}/${mission.puzzles.length}]  OPERATOR: ${p.operator}\n\n${p.prompt.replace(/^OPERATOR [^/]+ \/\/ /,'')}\n\n${p.guide}${reveal}`,'mission');input.disabled=false;input.focus()}
function showComplete(){clearScreen();const box=document.createElement('div');box.id='completion';box.className='complete success';box.textContent='ARCHIVE RESTORED // TEAM SUCCEEDED\nReport to your leader for the earned treat. ';const a=document.createElement('button');a.type='button';a.className='button';a.textContent='UNLOCK NORMAL ARCADE';a.addEventListener('click',openArcade);box.appendChild(document.createElement('br'));box.appendChild(a);screen.appendChild(box);input.disabled=false}
function addBootDiagnostic(){const lines=[
  {text:'[ FICTIONAL TRAINING SIMULATION ]',kind:'boot-label'},
  {text:'AWANACADE STATUS .... DOWN',kind:'down'},
  {text:'ARCADE CORE .... LOCKED',kind:'locked'},
  {text:'FLOOD ARCHIVE .... CORRUPTED',kind:'corrupt'},
  {text:'INTRUSION SIGNATURE .... MoR',kind:'signature'},
  {text:'MoR WAS HERE // YOUR MOVE, OPERATORS',kind:'boot-taunt'},
  {text:'Restore the archive to bring AWANACADE online.',kind:'boot-objective'}
],box=document.createElement('div');box.className='boot-diagnostic';box.setAttribute('aria-label','Fictional outage diagnostic');
  lines.forEach((line,i)=>{const row=document.createElement('div');row.className='boot-row '+line.kind;row.style.setProperty('--row',i);if(['down','locked','corrupt','signature'].includes(line.kind)){row.classList.add('boot-status');const [labelText,valueText]=line.text.split(' .... '),label=document.createElement('span'),dots=document.createElement('span'),value=document.createElement('span');label.textContent=labelText;dots.className='dots';dots.textContent='....';value.className='value '+line.kind;if(line.kind==='signature'){value.append('Mo');const glitch=document.createElement('span');glitch.className='signal-glitch';glitch.textContent='R';value.appendChild(glitch)}else value.textContent=valueText;row.append(label,' ',dots,' ',value)}else{if(i===0){const dot=document.createElement('span');dot.className='disconnect-dot';dot.setAttribute('aria-hidden','true');row.appendChild(dot)}row.append(line.text)}box.appendChild(row)});
  screen.appendChild(box);transcript.push(lines.map(line=>line.text).join('\n'))
}
function boot(){clearScreen();transcript=[];addBootDiagnostic();add('Hint: type HELP','prompt-line');input.disabled=false;input.focus()}
function openArcade(){storeSet(API.UNLOCK_KEY,'1');location.href='arcade.html'}
function finishLoading(){loadingTimers.forEach(clearTimeout);loadingTimers=[];skipLoading.hidden=true;state.started=true;save();showMission()}
function startLoading(){if(state.started){showMission();return}clearScreen();input.disabled=true;skipLoading.hidden=false;add(mission.intro,'mission');const title=add('LOADING FLOOD.EXE','loading'),bar=document.createElement('div'),fill=document.createElement('i');bar.className='progress';bar.setAttribute('role','progressbar');bar.setAttribute('aria-label','Mission loading progress');bar.setAttribute('aria-valuemin','0');bar.setAttribute('aria-valuemax','100');bar.setAttribute('aria-valuenow','0');fill.style.width='0%';bar.appendChild(fill);screen.appendChild(bar);const phases=[['[■□□] MOUNTING ARCHIVE',34],['[■■□] LOADING MISSION',67],['[■■■] OPERATOR READY',100]];phases.forEach((phase,i)=>loadingTimers.push(setTimeout(()=>{title.textContent=phase[0];fill.style.width=phase[1]+'%';bar.setAttribute('aria-valuenow',String(phase[1]));if(i===phases.length-1)loadingTimers.push(setTimeout(finishLoading,450))},700+i*700)))}
skipLoading.addEventListener('click',finishLoading);
function completeStep(result){add(result.message,'success');tone(true);state.index++;if(state.index>=mission.puzzles.length){state.completed=true;state.index=mission.puzzles.length;save();setTimeout(showComplete,500)}else{save();input.disabled=true;add('Loading next operator…','muted');setTimeout(showMission,650)}}
function initialHelp(){add('COVENANT TERMINAL\nType commands after > and press Enter.\nSTART HERE: RUN FLOOD.EXE\nNeed help later? Type HELP.','line')}
function contextualHelp(){const p=puzzle();add(`NOW: ${p.guide}\n${p.help[0]}\nOther help: HINT or STATUS.`,'line')}
function handle(raw){const parsed=API.parseCommand(raw);if(parsed.error)return;add(`> ${raw}`,'prompt-line');
  if(!state.started){
    if(parsed.command==='HELP'){initialHelp();return}
    if(parsed.command==='STATUS'){add('STATUS: READY TO START // RUN FLOOD.EXE');return}
    if(parsed.command==='RUN'&&parsed.rawArgs.toUpperCase()==='FLOOD.EXE'){startLoading();return}
    if(!API.COMMANDS.includes(parsed.command)){add(`COMMAND NOT FOUND — ${parsed.command}. Type HELP.`,'error');tone(false);return}
    add('SYNTAX — Start with: RUN FLOOD.EXE','warn');tone(false);return
  }
  if(parsed.command==='HELP'){contextualHelp();return}
  if(parsed.command==='STATUS'){add(state.completed?'STATUS: ARCHIVE RESTORED':`STATUS: MISSION ${state.index+1}/${mission.puzzles.length} // ${puzzle().operator}`);return}
  if(parsed.command==='LOG'||parsed.command==='HISTORY'){clearScreen();add('MISSION HISTORY','muted',false);add(transcript.join('\n'),'line',false);return}
  if(parsed.command==='MISSION'){showMission();return}
  if(parsed.command==='CLEAR'){showMission();return}
  const p=puzzle();
  if(parsed.command==='FILES'){add(p.files.join('\n'));return}
  if(parsed.command==='SCAN'){add(p.scan);return}
  if(parsed.command==='MAP'){add('MAP: /archive  /records  /logs  /sim  /tools  /bin');return}
  if(parsed.command==='HINT'){const level=API.nextHint(state,p.id);save();add(`HINT ${level+1}/3: ${p.hints[level]}`,'warn');return}
  if(parsed.command==='READ'&&parsed.rawArgs){const key=Object.keys(p.read||{}).find(k=>k.toLowerCase()===parsed.rawArgs.toLowerCase());if(key&&!p.accepts.some(a=>a.command==='READ'&&a.value.toLowerCase()===key.toLowerCase())){add(p.read[key]);return}}
  const result=API.evaluateAction(p,parsed);if(result.ok)completeStep(result);else{add(result.message,result.kind==='SYNTAX'?'warn':'error');tone(false)}
}
form.addEventListener('submit',e=>{e.preventDefault();const raw=input.value;if(raw.trim()){history.push(raw);historyAt=history.length;handle(raw)}input.value='';if(!input.disabled)input.focus()});
input.addEventListener('keydown',e=>{if(e.key==='ArrowUp'&&history.length){e.preventDefault();historyAt=Math.max(0,historyAt-1);input.value=history[historyAt]||'';input.setSelectionRange(input.value.length,input.value.length)}if(e.key==='ArrowDown'){e.preventDefault();historyAt=Math.min(history.length,historyAt+1);input.value=history[historyAt]||'';input.setSelectionRange(input.value.length,input.value.length)}});
document.getElementById('large-toggle').onclick=()=>document.body.classList.toggle('large');
document.getElementById('pause-toggle').onclick=()=>{const on=document.body.classList.toggle('paused');document.getElementById('pause-toggle').textContent=on?'RESUME CRT':'PAUSE CRT'};
document.getElementById('sound-toggle').onclick=()=>{sound=!sound;const b=document.getElementById('sound-toggle');b.textContent=`SOUND: ${sound?'ON':'OFF'}`;b.setAttribute('aria-pressed',String(sound));tone(true)};
document.getElementById('fullscreen-toggle').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(_){add('Fullscreen unavailable in this browser.','warn')}};
const dialog=document.getElementById('leader-dialog'),leaderMessage=document.getElementById('leader-message'),tools=document.getElementById('leader-tools'),readout=document.getElementById('leader-readout');
function openLeader(){hotspotClicks=0;dialog.showModal();document.getElementById('leader-code').focus()}
document.getElementById('leader-hotspot').onclick=()=>{hotspotClicks++;if(hotspotClicks>=5)openLeader()};document.getElementById('leader-close').onclick=()=>dialog.close();
document.getElementById('leader-form').onsubmit=e=>{e.preventDefault();const code=document.getElementById('leader-code').value.trim().toUpperCase();document.getElementById('leader-code').value='';if(code==='AWANA'){leaderMessage.textContent='Channel authorized.';tools.classList.add('open');readout.textContent=`STEP ${Math.min(state.index+1,mission.puzzles.length)}/${mission.puzzles.length}`}else{leaderMessage.textContent='Access denied.';tools.classList.remove('open');readout.textContent='Channel locked.'}};
tools.onclick=e=>{const action=e.target.dataset.leader;if(!action)return;const p=puzzle();if(action==='answer')readout.textContent=p.route;if(action==='hint'){const n=API.nextHint(state,p.id);save();readout.textContent=`HINT ${n+1}/3: ${p.hints[n]}`}if(action==='skip'){if(!state.started)state.started=true;if(!state.completed)completeStep({message:'Leader advanced this step.'});readout.textContent='Step advanced.'}if(action==='reset'){loadingTimers.forEach(clearTimeout);state=defaultState();save();dialog.close();input.disabled=false;skipLoading.hidden=true;boot();input.focus()}if(action==='arcade')openArcade();if(action==='support')window.open('games/retro_screensaver.html?mode=mor&v=2','mor-support-display');if(action==='relock'){storeRemove(API.UNLOCK_KEY);storeRemove(API.STORAGE_KEY);state=defaultState();location.href='index.html?relocked=1'}};
document.addEventListener('click',e=>{if(!e.target.closest('button,input,dialog')&&!input.disabled)input.focus()});
if(state.completed)showComplete();else if(state.started)showMission();else boot();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>

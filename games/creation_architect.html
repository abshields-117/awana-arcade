<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function() {
  const memStore = {};
  try {
    const test = window.localStorage;
    test.setItem('__test', '1');
    test.removeItem('__test');
  } catch (e) {
    console.warn('Storage sandbox active; engaging memory storage fallback.');
    try {
      Object.defineProperty(window, 'localStorage', {
        value: {
          getItem: (k) => memStore[k] || null,
          setItem: (k, v) => { memStore[k] = String(v); },
          removeItem: (k) => { delete memStore[k]; },
          clear: () => { for (const k in memStore) delete memStore[k]; }
        },
        writable: true,
        configurable: true
      });
    } catch(err) {}
  }
})();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genesis 1: The Creation Architect</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at center, #0f172a, #020617);
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 30px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.8);
      border-bottom: 4px solid #38bdf8;
      box-shadow: 0 8px 40px rgba(56, 189, 248, 0.2);
    }
    header h1 {
      margin: 0;
      font-size: 72px;
      letter-spacing: 4px;
      color: #38bdf8;
      text-shadow: 0 0 24px rgba(56, 189, 248, 0.6);
    }
    .badge {
      background: #0284c7;
      padding: 12px 32px;
      border-radius: 40px;
      font-weight: bold;
      font-size: 32px;
      letter-spacing: 2px;
    }
    #main-container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }
    #canvas-container {
      flex: 3;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #sidebar {
      flex: 1.2;
      background: rgba(15, 23, 42, 0.85);
      border-left: 4px solid #334155;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 30px;
      overflow-y: auto;
    }
    .day-btn {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 4px solid #475569;
      color: #f8fafc;
      padding: 30px 40px;
      border-radius: 24px;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 30px;
      transition: all 0.2s ease;
      text-align: left;
    }
    .day-btn:hover, .day-btn.active {
      border-color: #38bdf8;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
      transform: scale(1.02);
    }
    .day-icon {
      font-size: 52px;
    }
    #verse-card {
      position: absolute;
      bottom: 50px;
      left: 50px;
      right: 72%;
      background: rgba(15, 23, 42, 0.9);
      border: 4px solid #38bdf8;
      border-radius: 28px;
      padding: 40px 50px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      backdrop-filter: blur(16px);

    }
    #verse-title {
      font-size: 80px;
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 16px;
    }
    #verse-text {
      font-size: 64px;
      line-height: 1.5;
      color: #e2e8f0;
    }
    #quiz-modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #0f172a;
      border: 6px solid #f59e0b;
      padding: 60px;
      border-radius: 40px;
      width: min(85vw, 1200px);
      text-align: center;
      box-shadow: 0 0 80px rgba(245, 158, 11, 0.5);
      z-index: 100;
    }
    .quiz-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
      margin-top: 50px;
    }
    .quiz-btn {
      background: #1e293b;
      border: 4px solid #64748b;
      color: #fff;
      padding: 32px;
      font-size: 40px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .quiz-btn:hover {
      background: #f59e0b;
      color: #000;
      border-color: #fbbf24;
    }
    .bottom-bar {
      display: flex;
      gap: 20px;
      margin-top: auto;
    }
    .action-btn {
      flex: 1;
      padding: 30px;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 24px;
      transition: all 0.2s ease;
    }
    .action-btn:hover {
      transform: scale(1.05);
    }
    #scoreboard {
      position: absolute;
      top: 50px;
      right: 50px;
      background: rgba(15, 23, 42, 0.85);
      border: 4px solid #f59e0b;
      padding: 30px;
      border-radius: 24px;
      color: #fff;
      font-size: 64px;
      text-align: center;
    }
    .team {
      margin-bottom: 20px;
    }
    .team h2 {
      margin: 0;
      font-size: 72px;
      letter-spacing: 2px;
    }
    .score {
      font-size: 128px;
      font-weight: bold;
    }
    #team-red h2, .score.red {
      color: red;
    }
    #team-blue h2, .score.blue {
      color: blue;
    }
    #answer-reveal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.9);
      border: 6px solid #f59e0b;
      padding: 60px;
      border-radius: 40px;
      width: min(85vw, 1200px);
      text-align: center;
      box-shadow: 0 0 80px rgba(245, 158, 11, 0.5);
      z-index: 101;
    }
    #answer-reveal h1 {
      font-size: 72px;
      color: #38bdf8;
    }
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: white;
      border-radius: 50%;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(300px); opacity: 0; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Genesis 1: The Creation Architect</h1>
    <div class="badge">Interactive Classroom Edition</div>
  </header>
  <div id="main-container">
    <div id="canvas-container">
      <canvas></canvas>
    </div>
    <div id="sidebar">
      <button class="day-btn" onclick="setDay(1)"><span class="day-icon">🌞</span> Day 1</button>
      <button class="day-btn" onclick="setDay(2)"><span class="day-icon">🌱</span> Day 2</button>
      <button class="day-btn" onclick="setDay(3)"><span class="day-icon">🌳</span> Day 3</button>
      <button class="day-btn" onclick="setDay(4)"><span class="day-icon">🌞🌙</span> Day 4</button>
      <button class="day-btn" onclick="setDay(5)"><span class="day-icon">🐦🐟</span> Day 5</button>
      <button class="day-btn" onclick="setDay(6)"><span class="day-icon">🐘👑</span> Day 6</button>
      <button class="day-btn" onclick="setDay(7)"><span class="day-icon">🌙✨</span> Day 7</button>
    </div>
  </div>
  <div id="verse-card">
    <h2 id="verse-title"></h2>
    <p id="verse-text"></p>
  </div>
  <div id="quiz-modal">
    <h1 id="quiz-question"></h1>
    <div class="quiz-options" id="quiz-buttons"></div>
    <div class="bottom-bar">
      <button class="action-btn" onclick="nextQuestion()">Next Question</button>
    </div>
  </div>
  <div id="answer-reveal">
    <h1 id="reveal-message"></h1>
    <div class="bottom-bar">
      <button class="action-btn" onclick="awardPoints('red')">+100 TO TEAM RED 🔴</button>
      <button class="action-btn" onclick="awardPoints('blue')">+100 TO TEAM BLUE 🔵</button>
      <button class="action-btn" onclick="nextQuestion()">Next Question</button>
    </div>
  </div>
  <div id="scoreboard">
    <div id="team-red" class="team">
      <h2>TEAM RED</h2>
      <div class="score">0</div>
    </div>
    <div id="team-blue" class="team">
      <h2>TEAM BLUE</h2>
      <div class="score">0</div>
    </div>
  </div>
  <script>
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    function playSoundEffect(effect) {
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      switch (effect) {
        case 'chime':
          oscillator.type = 'sine';
          oscillator.frequency.setValueAtTime(880, audioContext.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 1);
          break;
        case 'buzz':
          oscillator.type = 'square';
          oscillator.frequency.setValueAtTime(220, audioContext.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
          break;
        case 'fanfare':
          oscillator.type = 'triangle';
          oscillator.frequency.setValueAtTime(440, audioContext.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 2);
          break;
      }
      oscillator.start();
    }

    let currentDay = 1;
    function setDay(day) {
      if (dayData[day]) {
        currentDay = day;
        document.querySelectorAll('.day-btn').forEach((b, idx) => b.classList.toggle('active', idx + 1 === day));
        document.getElementById('verse-title').textContent = dayData[day].title;
        document.getElementById('verse-text').textContent = dayData[day].verse;
      }
    }

    const particles = [];
    for (let i = 0; i < 80; i++) {
      particles.push({
        x: Math.random() * 1600,
        y: Math.random() * 900,
        size: Math.random() * 2.5 + 1,
        seed: Math.random() * 10
      });
    }

    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let startTime = Date.now();
    function loop() {
      const t = (Date.now() - startTime) / 1000;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (dayData[currentDay]) dayData[currentDay].draw(t);
      requestAnimationFrame(loop);
    }
    loop();

    const quizQuestions = [
      { q: "What did God create on Day 1?", options: ["Sun & Moon", "Light & Darkness", "Animals", "Plants"], correct: 1 },
      { q: "On which day did God create the Sun, Moon, and Stars?", options: ["Day 2", "Day 3", "Day 4", "Day 5"], correct: 2 },
      { q: "What was created on Day 5?", options: ["Birds & Fish", "Land & Trees", "Light", "Man"], correct: 0 },
      { q: "Who was created in the image of God on Day 6?", options: ["The Angels", "Mankind", "Lions", "Whales"], correct: 1 },
      { q: "What did God do on the 7th Day?", options: ["Created more stars", "Rested & made it Holy", "Built a mountain", "Made the ocean"], correct: 1 },
      { q: "What did God create on Day 2?", options: ["Plants", "Animals", "Sky and Sea", "Sun & Moon"], correct: 2 },
      { q: "On which day did God create plants?", options: ["Day 3", "Day 4", "Day 5", "Day 6"], correct: 0 },
      { q: "What was created on Day 4?", options: ["Birds & Fish", "Land & Trees", "Sun & Moon", "Man"], correct: 2 },
      { q: "On which day did God create animals?", options: ["Day 3", "Day 5", "Day 6", "Day 7"], correct: 1 },
      { q: "What was created on Day 6 besides humans?", options: ["Plants", "Animals", "Sky and Sea", "Sun & Moon"], correct: 1 },
      { q: "What did God do after creating everything?", options: ["Created more stars", "Rested & made it Holy", "Built a mountain", "Made the ocean"], correct: 1 },
      { q: "Which day is considered the Sabbath?", options: ["Day 2", "Day 5", "Day 6", "Day 7"], correct: 3 }
    ];
    let quizIdx = 0;

    function openQuiz() {
      quizIdx = 0;
      showQuestion();
      document.getElementById('quiz-modal').style.display = 'block';
    }

    function showQuestion() {
      if (quizIdx < quizQuestions.length) {
        const question = quizQuestions[quizIdx];
        document.getElementById('quiz-question').textContent = question.q;
        const optionsContainer = document.getElementById('quiz-buttons');
        optionsContainer.innerHTML = '';
        question.options.forEach((option, index) => {
          const button = document.createElement('button');
          button.className = 'quiz-btn';
          button.textContent = option;
          button.onclick = () => answerQuestion(index);
          optionsContainer.appendChild(button);
        });
      } else {
        nextQuestion();
      }
    }

    function answerQuestion(selectedIndex) {
      if (selectedIndex === quizQuestions[quizIdx].correct) {
        playSoundEffect('chime');
        createConfetti();
      } else {
        playSoundEffect('buzz');
      }
      quizIdx++;
      showQuestion();
    }

    function nextQuestion() {
      document.getElementById('quiz-modal').style.display = 'none';
      document.getElementById('answer-reveal').style.display = 'none';
    }

    function awardPoints(team) {
      scores[team]++;
      document.querySelector(`#team-${team} .score`).textContent = scores[team];
      playSoundEffect('chime');
    }

    function createConfetti() {
      const confettiContainer = document.createElement('div');
      confettiContainer.style.position = 'absolute';
      confettiContainer.style.top = '50%';
      confettiContainer.style.left = '50%';
      confettiContainer.style.transform = 'translate(-50%, -50%)';
      for (let i = 0; i < 100; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = `${Math.random() * 100}%`;
        confetti.style.animationDuration = `${Math.random() * 3 + 2}s`;
        confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
        confettiContainer.appendChild(confetti);
      }
      document.body.appendChild(confettiContainer);
      setTimeout(() => {
        confettiContainer.remove();
      }, 4000);
    }

    const scores = { red: 0, blue: 0 };

    function handleKeyPress(event) {
      switch (event.key) {
        case '1': setDay(1); break;
        case '2': setDay(2); break;
        case '3': setDay(3); break;
        case '4': setDay(4); break;
        case '5': setDay(5); break;
        case '6': setDay(6); break;
        case '7': setDay(7); break;
        case 'q': openQuiz(); break;
        case 'r': awardPoints('red'); playSoundEffect('chime'); break;
        case 'b': awardPoints('blue'); playSoundEffect('chime'); break;
      }
    }

    window.addEventListener('keydown', handleKeyPress);

    const dayData = {
      1: { title: "Day 1", verse: "God created light.", draw: function(t) {} },
      2: { title: "Day 2", verse: "God separated the waters.", draw: function(t) {} },
      3: { title: "Day 3", verse: "God made land appear and plants grow.", draw: function(t) {} },
      4: { title: "Day 4", verse: "God created the sun, moon, and stars.", draw: function(t) {} },
      5: { title: "Day 5", verse: "God filled the waters with fish and birds.", draw: function(t) {} },
      6: { title: "Day 6", verse: "God made animals and humans.", draw: function(t) {} },
      7: { title: "Day 7", verse: "God rested.", draw: function(t) {} }
    };
  </script>

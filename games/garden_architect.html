<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function() {
  const memStore = {};
  try {
    const test = window.localStorage;
    test.setItem('__test', '1');
    test.removeItem('__test');
  } catch (e) {
    console.warn('Storage sandbox active; engaging memory storage fallback.');
    try {
      Object.defineProperty(window, 'localStorage', {
        value: {
          getItem: (k) => memStore[k] || null,
          setItem: (k, v) => { memStore[k] = String(v); },
          removeItem: (k) => { delete memStore[k]; },
          clear: () => { for (const k in memStore) delete memStore[k]; }
        },
        writable: true,
        configurable: true
      });
    } catch(err) {}
  }
})();
</script>
  <meta charset="UTF-8">
  <title>Garden Architect — Awana Genesis 2 Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #030a05;
      color: #f8fafc;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 72px;
      background: rgba(4, 20, 11, 0.95);
      border-bottom: 2px solid #22c55e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 32px;
      z-index: 10;
      backdrop-filter: blur(12px);
    }
    .brand {
      font-size: 24px;
      font-weight: 900;
      color: #4ade80;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      background: rgba(34, 197, 94, 0.2);
      border: 1.5px solid #22c55e;
      color: #86efac;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
    }
    .top-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .btn-act {
      background: rgba(30, 41, 59, 0.85);
      border: 1.5px solid #475569;
      color: #e2e8f0;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-act:hover { background: #334155; transform: scale(1.04); }
    .btn-act.prime {
      background: #22c55e;
      border-color: #4ade80;
      color: #04120b;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
    }

    #main-area {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: crosshair;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* PALETTE TOOLBAR (BOTTOM) */
    #palette {
      height: 92px;
      background: rgba(10, 25, 16, 0.95);
      border-top: 2px solid #22c55e;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      z-index: 10;
      backdrop-filter: blur(12px);
    }
    .tool-btn {
      background: #132e1c;
      border: 2px solid #2d6a4f;
      color: #f8fafc;
      padding: 8px 16px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      min-width: 82px;
      transition: all 0.15s ease;
    }
    .tool-btn:hover { background: #1b4332; border-color: #4ade80; transform: translateY(-3px); }
    .tool-btn.active {
      background: #22c55e;
      border-color: #86efac;
      color: #04120b;
      box-shadow: 0 0 25px rgba(34, 197, 94, 0.6);
      transform: translateY(-4px);
    }
    .tool-icon { font-size: 26px; }
    .tool-name { font-size: 11px; font-weight: 800; text-transform: uppercase; }

    /* OVERLAY BANNER */
    #banner {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid #38bdf8;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
      padding: 10px 28px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      pointer-events: none;
      z-index: 20;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; transform: translateX(-50%) scale(1.02); }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      🌿 <span>GARDEN ARCHITECT</span>
      <span class="badge">Genesis 2:8-15 • The Garden of Eden</span>
    </div>
    <div class="top-actions">
      <button class="btn-act prime" onclick="autoBuildEden()">✨ Auto-Plant Eden (Key 'R')</button>
      <button class="btn-act" onclick="breatheLife()">💨 Breath of Life (Space)</button>
      <button class="btn-act" onclick="toggleNight()">🌙 Toggle Night (Key 'N')</button>
      <button class="btn-act" onclick="clearGarden()" style="color:#f87171;">🗑️ Clear (Key 'C')</button>
    </div>
  </header>

  <div id="main-area">
    <div id="banner">👉 Pick a tool below, then click anywhere to plant & populate the Garden!</div>
    <canvas id="gardenCanvas"></canvas>
  </div>

  <div id="palette">
    <button class="tool-btn active" data-tool="tree_life" onclick="setTool('tree_life')">
      <span class="tool-icon">🌳</span>
      <span class="tool-name">Tree of Life</span>
    </button>
    <button class="tool-btn" data-tool="tree_knowledge" onclick="setTool('tree_knowledge')">
      <span class="tool-icon">🍎</span>
      <span class="tool-name">Tree of Know.</span>
    </button>
    <button class="tool-btn" data-tool="river" onclick="setTool('river')">
      <span class="tool-icon">🌊</span>
      <span class="tool-name">4 Rivers</span>
    </button>
    <button class="tool-btn" data-tool="flowers" onclick="setTool('flowers')">
      <span class="tool-icon">🌸</span>
      <span class="tool-name">Fruit & Flora</span>
    </button>
    <button class="tool-btn" data-tool="lion" onclick="setTool('lion')">
      <span class="tool-icon">🦁</span>
      <span class="tool-name">Lion</span>
    </button>
    <button class="tool-btn" data-tool="elephant" onclick="setTool('elephant')">
      <span class="tool-icon">🐘</span>
      <span class="tool-name">Elephant</span>
    </button>
    <button class="tool-btn" data-tool="kangaroo" onclick="setTool('kangaroo')">
      <span class="tool-icon">🦘</span>
      <span class="tool-name">Kangaroo</span>
    </button>
    <button class="tool-btn" data-tool="birds" onclick="setTool('birds')">
      <span class="tool-icon">🦅</span>
      <span class="tool-name">Eagle</span>
    </button>
    <button class="tool-btn" data-tool="butterflies" onclick="setTool('butterflies')">
      <span class="tool-icon">🦋</span>
      <span class="tool-name">Butterflies</span>
    </button>
    <button class="tool-btn" data-tool="adam" onclick="setTool('adam')">
      <span class="tool-icon">👤</span>
      <span class="tool-name">Adam</span>
    </button>
    <button class="tool-btn" data-tool="eve" onclick="setTool('eve')">
      <span class="tool-icon">👩</span>
      <span class="tool-name">Eve</span>
    </button>
  </div>

  <script>
    // Audio Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type, duration, vol=0.2) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }
    function playPlaceSound() {
      playBeep(440, 'triangle', 0.08);
      setTimeout(() => playBeep(660, 'triangle', 0.12), 60);
    }
    function playHarpArpeggio() {
      const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
      notes.forEach((f, i) => {
        setTimeout(() => playBeep(f, 'sine', 0.3, 0.25), i * 75);
      });
    }

    const canvas = document.getElementById('gardenCanvas');
    const ctx = canvas.getContext('2d');
    let isNight = false;

    function resize() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Garden Object Storage
    let currentTool = 'tree_life';
    let entities = [];
    let rivers = [];
    let breathParticles = [];

    function setTool(tool) {
      currentTool = tool;
      document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tool === tool);
      });
      playBeep(350, 'sine', 0.06);
    }

    // Canvas Click: Place Entity
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      spawnEntity(currentTool, x, y);
      playPlaceSound();
    });

    function spawnEntity(type, x, y) {
      const id = Date.now() + Math.random();
      if (type === 'river') {
        rivers.push({
          x: x, y: y,
          width: 38,
          dx: (Math.random() - 0.5) * 4,
          dy: 2 + Math.random() * 2
        });
        return;
      }

      let emoji = '🌳';
      let size = 64;
      let aura = null;
      let vx = 0;
      let vy = 0;

      if (type === 'tree_life') {
        emoji = '🌳'; size = 84; aura = '#fde047';
      } else if (type === 'tree_knowledge') {
        emoji = '🍎'; size = 78; aura = '#c084fc';
      } else if (type === 'flowers') {
        const flora = ['🌸', '🌺', '🍇', '🌿', '🌾', '🌴', '🌻'];
        emoji = flora[Math.floor(Math.random() * flora.length)];
        size = 46 + Math.random() * 16;
      } else if (type === 'lion') {
        emoji = '🦁'; size = 62; vx = (Math.random() - 0.5) * 0.8;
      } else if (type === 'elephant') {
        emoji = '🐘'; size = 74; vx = (Math.random() - 0.5) * 0.5;
      } else if (type === 'kangaroo') {
        emoji = '🦘'; size = 58; vx = (Math.random() - 0.5) * 1.2; vy = (Math.random() - 0.5) * 0.8;
      } else if (type === 'birds') {
        emoji = '🦅'; size = 52; vx = 1.5; vy = (Math.random() - 0.5) * 0.8;
      } else if (type === 'butterflies') {
        emoji = '🦋'; size = 36; vx = (Math.random() - 0.5) * 2; vy = (Math.random() - 0.5) * 2;
      } else if (type === 'adam') {
        emoji = '👤'; size = 64; aura = '#38bdf8';
      } else if (type === 'eve') {
        emoji = '👩'; size = 64; aura = '#f472b6';
      }

      entities.push({
        id, type, x, y, emoji, size, aura, vx, vy,
        floatOffset: Math.random() * Math.PI * 2
      });
    }

    // Breath of Life Particle Blast (Genesis 2:7)
    function breatheLife() {
      playHarpArpeggio();
      for (let i = 0; i < 120; i++) {
        breathParticles.push({
          x: canvas.width / 2 + (Math.random() - 0.5) * 200,
          y: canvas.height / 2 + (Math.random() - 0.5) * 200,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 0.5) * 10 - 2,
          r: 2 + Math.random() * 4,
          color: ['#fde047', '#4ade80', '#38bdf8', '#ffffff'][Math.floor(Math.random() * 4)],
          alpha: 1,
          decay: 0.01 + Math.random() * 0.015
        });
      }
    }

    // Auto-Plant Eden (1-Click Master Garden)
    function autoBuildEden() {
      clearGarden();
      playHarpArpeggio();

      // Rivers crossing
      rivers.push({ x: canvas.width * 0.5, y: 0, width: 44, dx: 0, dy: 3 });
      rivers.push({ x: 0, y: canvas.height * 0.5, width: 44, dx: 3, dy: 0 });

      // Centerpiece Trees
      spawnEntity('tree_life', canvas.width * 0.44, canvas.height * 0.45);
      spawnEntity('tree_knowledge', canvas.width * 0.56, canvas.height * 0.45);

      // Adam & Eve
      spawnEntity('adam', canvas.width * 0.47, canvas.height * 0.58);
      spawnEntity('eve', canvas.width * 0.53, canvas.height * 0.58);

      // Surrounding Flora
      for (let i = 0; i < 28; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        spawnEntity('flowers', x, y);
      }

      // Animals
      spawnEntity('lion', canvas.width * 0.25, canvas.height * 0.35);
      spawnEntity('elephant', canvas.width * 0.78, canvas.height * 0.32);
      spawnEntity('kangaroo', canvas.width * 0.22, canvas.height * 0.72);
      spawnEntity('birds', canvas.width * 0.82, canvas.height * 0.2);
      spawnEntity('butterflies', canvas.width * 0.5, canvas.height * 0.3);
      spawnEntity('butterflies', canvas.width * 0.35, canvas.height * 0.6);
      spawnEntity('butterflies', canvas.width * 0.65, canvas.height * 0.6);

      breatheLife();
    }

    function clearGarden() {
      entities = [];
      rivers = [];
      breathParticles = [];
      playBeep(220, 'sawtooth', 0.15);
    }

    function toggleNight() {
      isNight = !isNight;
      playBeep(isNight ? 280 : 560, 'sine', 0.15);
    }

    // Main Animation Loop
    let tick = 0;
    function render() {
      tick++;

      // Background Ground (Lush Grass or Nighttime Meadow)
      ctx.fillStyle = isNight ? '#031008' : '#0a2312';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid/soil ambient details
      ctx.fillStyle = isNight ? 'rgba(74, 222, 128, 0.03)' : 'rgba(74, 222, 128, 0.06)';
      for (let x = 0; x < canvas.width; x += 60) {
        ctx.fillRect(x, 0, 1, canvas.height);
      }
      for (let y = 0; y < canvas.height; y += 60) {
        ctx.fillRect(0, y, canvas.width, 1);
      }

      // Draw Rivers
      rivers.forEach(r => {
        ctx.beginPath();
        if (r.dx === 0) {
          // Vertical River
          ctx.rect(r.x - r.width/2, 0, r.width, canvas.height);
        } else {
          // Horizontal River
          ctx.rect(0, r.y - r.width/2, canvas.width, r.width);
        }
        ctx.fillStyle = isNight ? '#0369a1' : '#0284c7';
        ctx.fill();

        // Water currents
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 2;
        ctx.stroke();
      });

      // Draw Entities
      entities.forEach(ent => {
        // Simple entity movement for animals/birds
        ent.x += ent.vx;
        ent.y += ent.vy;

        // Bounce on boundaries
        if (ent.x < 50 || ent.x > canvas.width - 50) ent.vx *= -1;
        if (ent.y < 50 || ent.y > canvas.height - 50) ent.vy *= -1;

        const floatY = Math.sin(tick * 0.05 + ent.floatOffset) * 4;

        // Aura Glow for Sacred Trees / Adam & Eve
        if (ent.aura) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(ent.x, ent.y + floatY, ent.size * 0.65, 0, Math.PI * 2);
          ctx.fillStyle = ent.aura;
          ctx.globalAlpha = 0.25 + Math.sin(tick * 0.08) * 0.1;
          ctx.shadowColor = ent.aura;
          ctx.shadowBlur = 30;
          ctx.fill();
          ctx.restore();
        }

        // Draw Entity Emoji
        ctx.save();
        ctx.font = `${ent.size}px "Segoe UI Emoji", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(ent.emoji, ent.x, ent.y + floatY);
        ctx.restore();
      });

      // Breath of Life Particles
      for (let i = breathParticles.length - 1; i >= 0; i--) {
        const p = breathParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;

        ctx.save();
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.restore();

        if (p.alpha <= 0) breathParticles.splice(i, 1);
      }

      requestAnimationFrame(render);
    }
    render();

    // Hotkey Controls
    window.addEventListener('keydown', (e) => {
      const k = e.key.toUpperCase();
      if (k === 'R') autoBuildEden();
      else if (k === 'C') clearGarden();
      else if (k === 'N') toggleNight();
      else if (k === ' ' || k === 'SPACE') { e.preventDefault(); breatheLife(); }
      else if (['1','2','3','4','5','6','7','8','9'].includes(e.key)) {
        const tools = ['tree_life', 'tree_knowledge', 'river', 'flowers', 'lion', 'elephant', 'kangaroo', 'birds', 'butterflies'];
        const idx = parseInt(e.key) - 1;
        if (tools[idx]) setTool(tools[idx]);
      }
    });

    // Auto-populate on first load!
    setTimeout(autoBuildEden, 400);
  </script>

</body>

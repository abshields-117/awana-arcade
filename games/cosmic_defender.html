<script>
(function() {
  const memStore = {};
  try {
    const test = window.localStorage;
    test.setItem('__test', '1');
    test.removeItem('__test');
  } catch (e) {
    console.warn('Storage sandbox active; engaging memory storage fallback.');
    try {
      Object.defineProperty(window, 'localStorage', {
        value: {
          getItem: (k) => memStore[k] || null,
          setItem: (k, v) => { memStore[k] = String(v); },
          removeItem: (k) => { delete memStore[k]; },
          clear: () => { for (const k in memStore) delete memStore[k]; }
        },
        writable: true,
        configurable: true
      });
    } catch(err) {}
  }
})();
</script>
  <meta charset="UTF-8">

<script>
  // AUDIO SYNTHESIS ENGINE (Web Audio API - 100% Offline Single File!)
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playTone(freq, type, duration, delay=0) {
    setTimeout(() => {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }, delay * 1000);
  }

  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (type === 'buzzerA') {
      playTone(440, 'sine', 0.2);
      playTone(660, 'triangle', 0.3, 0.08);
      playTone(880, 'sine', 0.4, 0.16);
    } else if (type === 'buzzerB') {
      playTone(523, 'sine', 0.2);
      playTone(659, 'triangle', 0.3, 0.08);
      playTone(1046, 'sine', 0.4, 0.16);
    } else if (type === 'laser') {
      for (let i = 0; i < 5; i++) {
        playTone(900 - i * 150, 'sawtooth', 0.04, i * 0.03);
      }
    } else if (type === 'fanfare') {
      playTone(523, 'triangle', 0.15, 0);
      playTone(659, 'triangle', 0.15, 0.12);
      playTone(784, 'triangle', 0.2, 0.24);
      playTone(1046, 'triangle', 0.5, 0.36);
    } else if (type === 'cheer') {
      playTone(880, 'sine', 0.3, 0);
      playTone(1100, 'triangle', 0.4, 0.1);
      spawnConfetti();
    } else if (type === 'whistle') {
      for (let i = 0; i < 8; i++) {
        playTone(600 + Math.sin(i) * 200, 'sine', 0.05, i * 0.04);
      }
    }
  }

  // TRIVIA QUESTION DECK
  const questions = [
    {
      cat: "TRUTH & SCRIPTURE // VERSE MEMORY",
      q: "In John 14:6, what three things did Jesus declare that He is?",
      a: "The WAY, the TRUTH, and the LIFE!"
    },
    {
      cat: "THE SCALE OF CREATION // COSMIC SIZE",
      q: "True or False: The Sun is the biggest star in the entire universe?",
      a: "FALSE! Stars like UY Scuti are so massive they could fit 5 BILLION Suns inside them!"
    },
    {
      cat: "BIBLE DISCOVERY // OLD & NEW TESTAMENT",
      q: "How many total books are in the Bible?",
      a: "66 Books! (39 in the Old Testament + 27 in the New Testament)"
    },
    {
      cat: "GOD OF THE STARS // PSALM 147:4",
      q: "According to Psalm 147:4, what amazing thing does God do with every star in space?",
      a: "He numbers them ALL and calls every single star by NAME!"
    },
    {
      cat: "2 TIMOTHY 2:15 // APPROVED WORKER",
      q: "What is an approved worker of God called to 'rightly handle'?",
      a: "The WORD OF TRUTH!"
    },
    {
      cat: "CREATION REVELATION // PSALM 19:1",
      q: "Complete this verse: 'The heavens declare the ________ of God; the skies proclaim the work of His hands.'",
      a: "GLORY of God!"
    }
  ];

  let currentQIdx = 0;
  let scoreA = 0;
  let scoreB = 0;
  let buzzedTeam = null;
  let timerInterval = null;

  function loadQuestion(idx) {
    const q = questions[idx];
    document.getElementById('qCategory').textContent = `${q.cat} (MISSION ${idx + 1} OF ${questions.length})`;
    document.getElementById('qText').textContent = q.q;
    document.getElementById('qAnswer').textContent = q.a;
    document.getElementById('qAnswer').style.display = 'none';
    resetTimer();
  }

  function nextQuestion() {
    currentQIdx = (currentQIdx + 1) % questions.length;
    loadQuestion(currentQIdx);
    resetBuzzers();
  }

  function revealAnswer() {
    const box = document.getElementById('qAnswer');
    box.style.display = 'block';
    playSound('fanfare');
    spawnConfetti();
  }

  function addPoint(team) {
    if (team === 'A') {
      scoreA += 100;
      document.getElementById('scoreA').textContent = scoreA;
      playSound('fanfare');
    } else {
      scoreB += 100;
      document.getElementById('scoreB').textContent = scoreB;
      playSound('fanfare');
    }
    spawnConfetti();
  }

  function handleBuzzer(team) {
    if (buzzedTeam !== null) return; // Lockout
    buzzedTeam = team;
    if (team === 'A') {
      document.getElementById('teamBoxA').classList.add('buzzed-a');
      playSound('buzzerA');
    } else {
      document.getElementById('teamBoxB').classList.add('buzzed-b');
      playSound('buzzerB');
    }
  }

  function resetBuzzers() {
    buzzedTeam = null;
    document.getElementById('teamBoxA').classList.remove('buzzed-a');
    document.getElementById('teamBoxB').classList.remove('buzzed-b');
  }

  function startTimer() {
    resetTimer();
    const bar = document.getElementById('timerBar');
    bar.style.transition = 'width 15s linear';
    bar.style.width = '0%';
    playTone(600, 'sine', 0.1);
  }

  function resetTimer() {
    const bar = document.getElementById('timerBar');
    bar.style.transition = 'none';
    bar.style.width = '100%';
  }

  // KEYBOARD CONTROLS
  window.addEventListener('keydown', (e) => {
    if (e.key === 'a' || e.key === 'A') handleBuzzer('A');
    if (e.key === 'l' || e.key === 'L') handleBuzzer('B');
    if (e.key === ' ') { resetBuzzers(); e.preventDefault(); }
    if (e.key === 'Enter') revealAnswer();
    if (e.key === 'ArrowRight') nextQuestion();
    if (e.key === 't' || e.key === 'T') startTimer();
    if (e.key === '1') playSound('fanfare');
    if (e.key === '2') playSound('laser');
    if (e.key === '3') playSound('cheer');
    if (e.key === '4') playSound('whistle');
  });

  // MODE SWITCHER (Trivia vs Galaxy Architect)
  let currentMode = 'trivia';
  let activeTool = 'planet';

  function setMode(mode) {
    currentMode = mode;
    document.getElementById('btnModeTrivia').classList.toggle('active', mode === 'trivia');
    document.getElementById('btnModeArchitect').classList.toggle('active', mode === 'architect');
    document.getElementById('triviaCard').style.display = (mode === 'trivia') ? 'block' : 'none';
    document.getElementById('scoreBoard').style.display = (mode === 'trivia') ? 'flex' : 'none';
    document.getElementById('architectBar').style.display = (mode === 'architect') ? 'flex' : 'none';
  }

  function setTool(tool) {
    activeTool = tool;
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tool' + tool.charAt(0).toUpperCase() + tool.slice(1)).classList.add('active');
  }

  function clearUniverse() {
    celestialBodies.length = 0;
    playSound('laser');
  }

  // CANVAS COSMIC PARTICLES & GALAXY PHYSICS
  const canvas = document.getElementById('spaceCanvas');
  const ctx = canvas.getContext('2d');
  let width, height;

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Background Starfield
  const stars = [];
  for (let i = 0; i < 200; i++) {
    stars.push({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 2 + 0.5,
      alpha: Math.random(),
      speed: Math.random() * 0.02 + 0.005
    });
  }

  // Celestial Bodies (Planets, Galaxies, Supernovas)
  const celestialBodies = [];

  class Celestial {
    constructor(x, y, type) {
      this.x = x;
      this.y = y;
      this.type = type;
      this.particles = [];
      this.age = 0;

      if (type === 'planet') {
        this.color = ['#38BDF8', '#FBBF24', '#34D399', '#C084FC', '#F472B6'][Math.floor(Math.random() * 5)];
        this.radius = Math.random() * 28 + 18;
        this.ring = Math.random() > 0.4;
        this.ringAngle = Math.random() * Math.PI;
      } else if (type === 'galaxy') {
        const arms = 3;
        const ptsPerArm = 60;
        this.color = '#C084FC';
        for (let a = 0; a < arms; a++) {
          const armOffset = (a * 2 * Math.PI) / arms;
          for (let p = 0; p < ptsPerArm; p++) {
            const dist = p * 2.2;
            const angle = armOffset + dist * 0.05;
            this.particles.push({ dist, angle, speed: 0.015 - dist * 0.00008, color: dist < 40 ? '#FBBF24' : '#38BDF8' });
          }
        }
      } else if (type === 'supernova') {
        for (let i = 0; i < 120; i++) {
          const angle = Math.random() * 2 * Math.PI;
          const spd = Math.random() * 8 + 2;
          this.particles.push({
            x: 0, y: 0,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            life: 1,
            color: ['#FBBF24', '#F472B6', '#FFF', '#38BDF8'][Math.floor(Math.random() * 4)]
          });
        }
      }
    }

    update() {
      this.age++;
      if (this.type === 'supernova') {
        this.particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.96;
          p.vy *= 0.96;
          p.life -= 0.012;
        });
      } else if (this.type === 'galaxy') {
        this.particles.forEach(p => {
          p.angle += p.speed;
        });
      }
    }

    draw() {
      if (this.type === 'planet') {
        ctx.save();
        ctx.translate(this.x, this.y);
        // Atmosphere Glow
        ctx.beginPath();
        ctx.arc(0, 0, this.radius * 1.3, 0, Math.PI * 2);
        ctx.fillStyle = this.color + '20';
        ctx.fill();

        // Planet Body
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 20;
        ctx.fill();

        // Optional Rings
        if (this.ring) {
          ctx.rotate(this.ringAngle);
          ctx.beginPath();
          ctx.ellipse(0, 0, this.radius * 2.2, this.radius * 0.45, 0, 0, Math.PI * 2);
          ctx.strokeStyle = '#FFFFFF80';
          ctx.lineWidth = 3;
          ctx.stroke();
        }
        ctx.restore();
      } else if (this.type === 'galaxy') {
        ctx.save();
        ctx.translate(this.x, this.y);
        this.particles.forEach(p => {
          const px = Math.cos(p.angle) * p.dist;
          const py = Math.sin(p.angle) * p.dist * 0.6; // tilted
          ctx.beginPath();
          ctx.arc(px, py, 1.8, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 8;
          ctx.fill();
        });
        ctx.restore();
      } else if (this.type === 'supernova') {
        ctx.save();
        ctx.translate(this.x, this.y);
        this.particles.forEach(p => {
          if (p.life > 0) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.life * 3.5, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 12;
            ctx.fill();
          }
        });
        ctx.restore();
      }
    }
  }

  // Interactive Click in Space
  canvas.addEventListener('click', (e) => {
    if (currentMode === 'architect') {
      celestialBodies.push(new Celestial(e.clientX, e.clientY, activeTool));
      playSound('laser');
    }
  });

  // Confetti Cannons
  const confetti = [];
  function spawnConfetti() {
    for (let i = 0; i < 80; i++) {
      confetti.push({
        x: width / 2,
        y: height / 2 + 100,
        vx: (Math.random() - 0.5) * 16,
        vy: (Math.random() - 0.8) * 18,
        r: Math.random() * 6 + 4,
        color: ['#38BDF8', '#FBBF24', '#F472B6', '#34D399', '#C084FC'][Math.floor(Math.random() * 5)],
        rot: Math.random() * 360,
        vRot: (Math.random() - 0.5) * 10,
        life: 1
      });
    }
  }

  // Animation Loop
  function loop() {
    ctx.clearRect(0, 0, width, height);

    // Stars
    stars.forEach(s => {
      s.alpha += s.speed;
      const a = (Math.sin(s.alpha) + 1) / 2;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${a * 0.8 + 0.2})`;
      ctx.fill();
    });

    // Celestial Bodies
    celestialBodies.forEach(b => {
      b.update();
      b.draw();
    });

    // Confetti
    for (let i = confetti.length - 1; i >= 0; i--) {
      const c = confetti[i];
      c.x += c.vx;
      c.y += c.vy;
      c.vy += 0.4; // gravity
      c.rot += c.vRot;
      c.life -= 0.015;

      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate((c.rot * Math.PI) / 180);
      ctx.fillStyle = c.color;
      ctx.fillRect(-c.r / 2, -c.r / 2, c.r, c.r);
      ctx.restore();

      if (c.life <= 0) confetti.splice(i, 1);
    }

    requestAnimationFrame(loop);
  }
  loop();

  // Initialize first question
  loadQuestion(0);
</script>

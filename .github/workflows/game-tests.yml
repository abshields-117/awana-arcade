name: Arcade game tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  game-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - name: Install Chromium test tools (not game dependencies)
        run: |
          npm install --prefix "$RUNNER_TEMP/hallows-tools" playwright@1.64.1
          "$RUNNER_TEMP/hallows-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise Path of Hallows in real Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          SERVER=$!
          trap 'kill "$SERVER"' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8765/ > /dev/null
          NODE_PATH="$RUNNER_TEMP/hallows-tools/node_modules" ARTIFACT_DIR="$RUNNER_TEMP/hallows-evidence" node tests/hallows-browser-smoke.cjs
      - name: Exercise physical presenter in real Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          SERVER=$!
          trap 'kill "$SERVER"' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8765/ > /dev/null
          NODE_PATH="$RUNNER_TEMP/hallows-tools/node_modules" ARTIFACT_DIR="$RUNNER_TEMP/physical-evidence" node tests/physical-browser-smoke.cjs
          NODE_PATH="$RUNNER_TEMP/hallows-tools/node_modules" EVIDENCE_DIR="$RUNNER_TEMP/library-evidence" node tests/enchanted-library-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physical-browser-screenshots
          path: ${{ runner.temp }}/physical-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enchanted-library-screenshots
          path: ${{ runner.temp }}/library-evidence
      - name: Exercise Phantom Manor Whispering Roots in real Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          SERVER=$!
          trap 'kill "$SERVER"' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8765/ > /dev/null
          NODE_PATH="$RUNNER_TEMP/hallows-tools/node_modules" ARTIFACT_DIR="$RUNNER_TEMP/deepwoods-evidence" node tests/deepwoods-browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepwoods-browser-screenshots
          path: ${{ runner.temp }}/deepwoods-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hallows-browser-screenshots
          path: ${{ runner.temp }}/hallows-evidence
